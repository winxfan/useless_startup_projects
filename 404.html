<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Redirect</title>
<script>
(function () {
  try {
    sessionStorage.setItem('spa-path', location.pathname + location.search + location.hash);
  } catch (e) {}
  var base = location.pathname.split('/').filter(Boolean);
  // go to site root index.html (or nested base if hosted in a folder)
  var to = '/index.html';
  if (base.length > 1) {
    base.pop();
    to = '/' + base.join('/') + '/index.html';
  }
  location.replace(to);
})();
</script>
</head>
<body></body>
</html>
